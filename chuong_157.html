
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fdfbf7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>Chương 157</title>
    
<style>
    :root {
        --bg-color: #fdfbf7; /* Màu nền giấy ấm, đỡ mỏi mắt */
        --text-color: #1a1a1a;
        --btn-bg: #007aff; /* Màu xanh chuẩn của iOS */
        --btn-text: #ffffff;
        --border-color: #e5e5ea;
        --missing-bg: #ffebee;
        --missing-text: #d32f2f;
    }

    /* Chế độ Dark Mode tự động theo hệ thống của iPhone */
    @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #000000; /* Nền đen sâu (OLED) giúp tiết kiệm pin iPhone */
            --text-color: #e5e5ea;
            --btn-bg: #1c1c1e;
            --btn-text: #0a84ff;
            --border-color: #38383a;
            --missing-bg: #3a1c1c;
            --missing-text: #ff453a;
        }
    }

    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        line-height: 1.6; 
        color: var(--text-color); 
        background-color: var(--bg-color);
        margin: 0;
        /* Tránh bị che bởi Dynamic Island và thanh ngang (Home Indicator) ở dưới cùng */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        -webkit-font-smoothing: antialiased;
    }

    .container {
        padding: 20px;
        max-width: 100%;
        box-sizing: border-box;
    }

    h1 { 
        font-size: 26px; 
        text-align: center; 
        margin-top: 10px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }
    
    h2 {
        font-size: 22px; 
        text-align: center;
        margin-top: 5px;
        font-weight: 600;
    }

    /* Cỡ chữ to hơn, tối ưu để đọc truyện trên màn hình lớn của Pro Max */
    .content { 
        font-size: 20px; 
        text-align: left; /* Đổi thành left thay vì justify để chữ không bị kéo giãn trên mobile */
        margin-top: 25px; 
        color: var(--text-color);
    }
    
    .content p { 
        margin-bottom: 22px; /* Dãn khoảng cách các đoạn để dễ bấm ngón tay */
    }

    .nav-buttons { 
        display: flex; 
        justify-content: space-between; 
        margin: 30px 0; 
        padding-top: 15px; 
        border-top: 1px solid var(--border-color); 
    }
    
    .btn { 
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        margin: 0 5px;
        padding: 14px 0; 
        background-color: var(--btn-bg); 
        color: var(--btn-text); 
        text-decoration: none; 
        border-radius: 12px; /* Bo góc to theo chuẩn UI iOS 18 */
        font-size: 17px;
        font-weight: 600;
        -webkit-tap-highlight-color: transparent; /* Tắt nháy xanh khi bấm trên Safari */
    }
    
    .btn:active { 
        opacity: 0.7; 
    }
    
    .btn.disabled { 
        background-color: var(--border-color); 
        color: #8e8e93; 
        pointer-events: none; 
    }

    .toc { 
        display: grid; 
        /* Cấu hình lưới 4 cột cho màn hình iPhone dọc */
        grid-template-columns: repeat(4, 1fr); 
        gap: 12px; 
        margin-top: 25px; 
        padding-bottom: 30px;
    }
    
    .toc a { 
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px 5px; 
        background-color: var(--btn-bg); 
        text-decoration: none; 
        color: var(--btn-text); 
        border-radius: 8px; 
        font-size: 16px;
        font-weight: 500;
    }
    
    .toc a.missing {
        background-color: var(--missing-bg);
        color: var(--missing-text);
    }
    
    .back-btn {
        display: block;
        text-align: center;
        color: #0a84ff;
        text-decoration: none;
        font-size: 17px;
        margin-bottom: 15px;
    }
</style>

</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">‹ Quay lại Mục lục</a>
        
        <h2>Chương 157</h2>
        
        <div class="nav-buttons">
            <a href="chuong_156.html" class="btn">‹ Trước</a>
            <a href="chuong_158.html" class="btn">Sau ›</a>
        </div>

        <div class="content">
            <p>Chương 157: Hoàng thúc xin tha cho, Cửu hoàng tử là nữ nhi… Xem thêm</p>

        </div>

        <div class="nav-buttons" style="margin-bottom: 50px;">
            <a href="chuong_156.html" class="btn">‹ Trước</a>
            <a href="chuong_158.html" class="btn">Sau ›</a>
        </div>
    </div>
</body>
</html>
