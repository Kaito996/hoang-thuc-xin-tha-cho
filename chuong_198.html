
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fdfbf7">
    <title>Chương 198</title>
    
<style>
    :root {
        --bg-color: #fdfbf7;
        --text-color: #1a1a1a;
        --btn-bg: #007aff;
        --btn-text: #ffffff;
        --border-color: #e5e5ea;
        --missing-bg: #ffebee;
        --missing-text: #d32f2f;
        --header-bg: #fdfbf7;
    }

    /* Chế độ Dark Mode khi được kích hoạt bằng nút */
    [data-theme="dark"] {
        --bg-color: #000000;
        --text-color: #e5e5ea;
        --btn-bg: #1c1c1e;
        --btn-text: #0a84ff;
        --border-color: #38383a;
        --missing-bg: #3a1c1c;
        --missing-text: #ff453a;
        --header-bg: #000000;
    }

    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        line-height: 1.6; 
        color: var(--text-color); 
        background-color: var(--bg-color);
        margin: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
        padding: 20px;
        padding-top: 60px; /* Nhường chỗ cho nút đổi màu */
        max-width: 100%;
        box-sizing: border-box;
    }

    /* Thanh Header nổi chứa nút đổi màu nền */
    .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 50px;
        background-color: var(--header-bg);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 0 20px;
        z-index: 1000;
        transition: background-color 0.3s ease;
    }

    #theme-toggle {
        background: none;
        border: none;
        color: var(--text-color);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        padding: 5px 10px;
        border-radius: 8px;
        background-color: var(--border-color);
    }

    h1 { font-size: 26px; text-align: center; margin-top: 10px; font-weight: 700; letter-spacing: -0.5px; }
    h2 { font-size: 22px; text-align: center; margin-top: 5px; font-weight: 600; }

    .content { font-size: 20px; text-align: left; margin-top: 25px; color: var(--text-color); }
    .content p { margin-bottom: 22px; }

    .nav-buttons { display: flex; justify-content: space-between; margin: 30px 0; padding-top: 15px; border-top: 1px solid var(--border-color); }
    
    .btn { 
        display: flex; align-items: center; justify-content: center; flex: 1; margin: 0 5px; padding: 14px 0; 
        background-color: var(--btn-bg); color: var(--btn-text); text-decoration: none; border-radius: 12px; 
        font-size: 17px; font-weight: 600; -webkit-tap-highlight-color: transparent; 
    }
    .btn:active { opacity: 0.7; }
    .btn.disabled { background-color: var(--border-color); color: #8e8e93; pointer-events: none; }

    .toc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 25px; padding-bottom: 30px; }
    .toc a { display: flex; align-items: center; justify-content: center; padding: 12px 5px; background-color: var(--btn-bg); text-decoration: none; color: var(--btn-text); border-radius: 8px; font-size: 16px; font-weight: 500; }
    .toc a.missing { background-color: var(--missing-bg); color: var(--missing-text); }
    
    .back-btn { display: block; text-align: center; color: #0a84ff; text-decoration: none; font-size: 17px; margin-bottom: 15px; }
</style>

</head>
<body>
    <div class="top-bar">
        <button id="theme-toggle">🌙 Chế độ Tối</button>
    </div>
    <div class="container">
        <a href="index.html" class="back-btn">‹ Quay lại Mục lục</a>
        
        <h2>Chương 198</h2>
        
        <div class="nav-buttons">
            <a href="chuong_197.html" class="btn">‹ Trước</a>
            <a href="chuong_199.html" class="btn">Sau ›</a>
        </div>

        <div class="content">
            <p>Chương 198: Hoàng thúc xin tha cho, Cửu hoàng tử là nữ nhi… Xem thêm</p>

        </div>

        <div class="nav-buttons" style="margin-bottom: 50px;">
            <a href="chuong_197.html" class="btn">‹ Trước</a>
            <a href="chuong_199.html" class="btn">Sau ›</a>
        </div>
    </div>
    
<script>
    const toggleBtn = document.getElementById('theme-toggle');
    
    // Kiểm tra xem người dùng đã chọn theme gì chưa, nếu chưa thì lấy theo hệ thống
    const currentTheme = localStorage.getItem('theme') ? localStorage.getItem('theme') : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    
    // Áp dụng theme ngay khi load trang
    document.documentElement.setAttribute('data-theme', currentTheme);
    updateBtnUI(currentTheme);

    // Khi bấm nút
    toggleBtn.addEventListener('click', () => {
        let theme = document.documentElement.getAttribute('data-theme');
        let newTheme = theme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateBtnUI(newTheme);
    });

    function updateBtnUI(theme) {
        if(theme === 'dark') {
            toggleBtn.innerHTML = '☀️ Chế độ Sáng';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
        } else {
            toggleBtn.innerHTML = '🌙 Chế độ Tối';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fdfbf7');
        }
    }
</script>

</body>
</html>
